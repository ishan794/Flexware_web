<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #144a78;
    --mint: #bcefc6;
    --ring: #e3e8ee;
    --chev: #5b84ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; background: #ffffff; position: relative; }
  .deco { position: absolute; inset: 0; }
  .logo { position: absolute; top: 92px; left: 95px; height: 96px; mix-blend-mode: multiply; }
  .li {
    position: absolute; top: 108px; right: 108px; width: 68px; height: 68px;
    border-radius: 12px; background: #eef0f3; display: grid; place-items: center;
    font-weight: 700; font-size: 34px; color: #9aa3ad;
  }
  .heading { position: absolute; top: 222px; left: 116px; }
  .heading .k { font-size: 22px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: #5b84ad; margin-bottom: 12px; }
  .heading h1 { font-size: 52px; font-weight: 700; line-height: 1.15; color: var(--navy); }
  .heading h1 span { background: var(--mint); padding: 0 10px; border-radius: 6px; }
  .roles { position: absolute; top: 400px; left: 116px; display: flex; flex-direction: column; gap: 54px; }
  .role { display: grid; grid-template-columns: 44px auto; column-gap: 0; row-gap: 12px; }
  .chev { grid-row: 1; align-self: center; color: var(--chev); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -9px; }
  .title {
    grid-column: 2; justify-self: start;
    background: var(--navy); color: #fff; border-radius: 8px;
    padding: 8px 22px; font-size: 30px; font-weight: 400; letter-spacing: 2.5px;
  }
  .tags { grid-column: 2; display: flex; gap: 14px; }
  .tag { background: var(--mint); color: #1a2a33; border-radius: 6px; padding: 7px 16px; font-size: 21px; }
  .apply { position: absolute; top: 1112px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 600; color: #0b0d10; }
  .url {
    position: absolute; top: 1172px; left: 50%; transform: translateX(-50%);
    background: #f1f2f4; border-radius: 10px; padding: 14px 26px;
    display: flex; align-items: center; gap: 18px; white-space: nowrap;
    font-size: 30px; color: var(--navy);
  }
</style>
</head>
<body>
  <svg class="deco" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
    <g fill="#e3e8ee">
      <circle cx="242" cy="47" r="27"/><circle cx="1022" cy="47" r="27"/>
      <circle cx="965" cy="250" r="18"/>
      <circle cx="1040" cy="628" r="19"/><circle cx="50" cy="760" r="24"/>
      <circle cx="1022" cy="748" r="27"/><circle cx="965" cy="950" r="18"/>
      <circle cx="690" cy="1094" r="15"/><circle cx="260" cy="1330" r="19"/>
      <circle cx="1040" cy="1330" r="19"/>
    </g>
    <g stroke="#e3e8ee" stroke-width="20">
      <circle cx="592" cy="50" r="40"/>
      <circle cx="40" cy="560" r="36"/><circle cx="835" cy="418" r="44"/><circle cx="1080" cy="418" r="34"/>
      <circle cx="738" cy="592" r="32"/><circle cx="720" cy="760" r="40"/>
      <circle cx="55" cy="1118" r="44"/><circle cx="295" cy="1118" r="27"/><circle cx="835" cy="1118" r="44"/>
      <circle cx="1080" cy="1118" r="34"/><circle cx="738" cy="1295" r="32"/>
    </g>
  </svg>

  <img class="logo" src="logo.png" alt="Flxware">
  <div class="li">in</div>

  <div class="heading">
    <div class="k">Now open</div>
    <h1><span>Internship</span> Opportunities</h1>
  </div>

  <div class="roles">
    <div class="role">
      <span class="chev">»</span><span class="title">Software Engineer (Fullstack)</span>
      <div class="tags"><span class="tag">Engineering</span><span class="tag">Onsite</span><span class="tag">Internship</span></div>
    </div>
    <div class="role">
      <span class="chev">»</span><span class="title">AI/ML Engineer</span>
      <div class="tags"><span class="tag">Engineering</span><span class="tag">Onsite</span><span class="tag">Internship</span></div>
    </div>
    <div class="role">
      <span class="chev">»</span><span class="title">QA/BA Engineer</span>
      <div class="tags"><span class="tag">QA &amp; Product</span><span class="tag">Onsite</span><span class="tag">Internship</span></div>
    </div>
    <div class="role">
      <span class="chev">»</span><span class="title">Customer Success &amp; Sales Executive</span>
      <div class="tags"><span class="tag">Sales</span><span class="tag">Onsite</span><span class="tag">Internship</span></div>
    </div>
  </div>

  <div class="apply">Apply Now</div>
  <div class="url">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#144a78" stroke-width="1.6">
      <circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/>
      <path d="M2 12h20M3.5 7h17M3.5 17h17"/>
    </svg>
    www.flxwaretech.com/careers
  </div>
</body>
</html>
