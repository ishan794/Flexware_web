<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #144a78;
    --navy-deep: #0b2a47;
    --mint: #bcefc6;
    --ring: #e3e8ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif; position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #ffffff 53%, #6f8aa5 58%, #1a4269 62%, var(--navy-deep) 68%);
  }
  .deco { position: absolute; inset: 0; }
  .logo { position: absolute; top: 92px; left: 95px; height: 96px; mix-blend-mode: multiply; }
  .li {
    position: absolute; top: 108px; right: 108px; width: 68px; height: 68px;
    border-radius: 12px; background: #eef0f3; display: grid; place-items: center;
    font-weight: 700; font-size: 34px; color: #9aa3ad;
  }

  /* Centre illustration: a small team at a desk, role badges around it */
  .team { position: absolute; top: 226px; left: 260px; width: 560px; height: 420px; }

  .badge {
    position: absolute; display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 16px; padding: 14px 22px 14px 14px;
    box-shadow: 0 16px 36px rgba(11,42,71,0.16), 0 0 0 1px rgba(11,42,71,0.05);
    font-size: 24px; font-weight: 600; color: var(--navy); white-space: nowrap;
  }
  .badge .ic { width: 56px; height: 56px; border-radius: 12px; background: var(--mint); display: grid; place-items: center; }
  .badge svg { width: 30px; height: 30px; stroke: var(--navy); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .headline {
    position: absolute; top: 850px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -3px; color: #fff;
  }
  .headline span { color: var(--mint); }
  .intern {
    position: absolute; top: 1012px; left: 0; right: 0; text-align: center;
    font-size: 40px; font-weight: 600; letter-spacing: 7px; text-transform: uppercase; color: #fff;
  }
  .intern span { color: var(--mint); }
  .cta {
    position: absolute; top: 1095px; left: 50%; transform: translateX(-50%);
    background: var(--mint); color: var(--navy-deep); border-radius: 12px;
    padding: 18px 44px; font-size: 34px; font-weight: 500; letter-spacing: 2px;
    display: flex; align-items: center; gap: 24px; white-space: nowrap;
  }
  .cta .chev { color: var(--navy); font-weight: 700; font-size: 42px; letter-spacing: -8px; }
  .url {
    position: absolute; top: 1238px; left: 0; right: 0; text-align: center;
    font-size: 27px; color: #c9d6e3; letter-spacing: 0.5px;
  }
  .url b { color: var(--mint); font-weight: 500; }
</style>
</head>
<body>
