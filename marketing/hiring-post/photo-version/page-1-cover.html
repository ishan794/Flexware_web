<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;
    background:
      radial-gradient(900px 700px at 50% 38%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg,#eef4f9 0%,#e9f3ef 55%,#e6eef6 100%);
    font-family:Poppins,sans-serif}
  .bub{position:absolute;border-radius:50%;background:#cdd7e3}
  .ring{position:absolute;border-radius:50%;border:22px solid #cdd7e3}
  .photo{position:absolute;left:-262px;top:-60px;width:1600px;height:1600px;
    background:url(person.jpg) center/cover;mix-blend-mode:multiply;filter:brightness(1.07) contrast(1.04);
    -webkit-mask-image:radial-gradient(560px 880px at 860px 900px,#000 55%,transparent 100%)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 48%,rgba(0,0,0,.5) 59%,rgba(0,0,0,.88) 68%,#000 76%)}
  .logo{position:absolute;left:96px;top:96px;width:290px;mix-blend-mode:multiply}
  .li{position:absolute;right:108px;top:116px;width:68px;height:68px;border-radius:12px;background:#e4e8ed;display:grid;place-items:center}
  h1{position:absolute;left:0;right:0;top:826px;text-align:center;font-weight:800;font-size:152px;letter-spacing:-3px;line-height:1;color:#fff}
  h1 span{color:#b4ecc5}
  .btn{position:absolute;left:50%;top:1068px;transform:translateX(-50%);width:500px;height:86px;border-radius:8px;background:#1b4f86;
    display:flex;align-items:center;justify-content:center;gap:30px;color:#fff;font-size:40px;font-weight:400;letter-spacing:2px}
  .intern{position:absolute;left:0;right:0;top:988px;text-align:center;font-size:38px;font-weight:500;letter-spacing:9px;color:#fff;text-transform:uppercase}
  .intern span{color:#b4ecc5;font-weight:800}
  .swipe{position:absolute;right:56px;bottom:52px;color:#7d8794;font-size:20px;letter-spacing:3px;text-transform:uppercase}
  .url{position:absolute;left:0;right:0;top:1222px;display:flex;justify-content:center;align-items:center;gap:12px;color:#c9e6d2;font-size:27px;letter-spacing:.5px}
</style></head>
